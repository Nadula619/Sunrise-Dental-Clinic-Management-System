<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sunrise Dental Clinic Management System</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-tooth"></i>
      </div>
      <h2>Sunrise Dental Clinic</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Colombo - Patient & Appointment Management</p>
    </div>

    <div id="loginAlert" style="display:none; padding:12px; border-radius:var(--radius-md); background:var(--danger-light); color:#991b1b; font-size:13px; margin-bottom:18px; border-left:4px solid var(--danger);">
      <i class="fa-solid fa-circle-exclamation" style="margin-right:6px;"></i> <span id="loginAlertMsg">Invalid credentials</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username <span class="req">*</span></label>
        <div style="position:relative;">
          <i class="fa-regular fa-user" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
          <input type="text" id="username" class="form-control" style="padding-left:40px;" placeholder="Enter staff username" required autofocus value="admin">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="req">*</span></label>
        <div style="position:relative;">
          <i class="fa-solid fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
          <input type="password" id="password" class="form-control" style="padding-left:40px;" placeholder="Enter staff password" required value="admin123">
        </div>
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 15px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to System
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center;">
      <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700;">Demo Accounts (Click to Fill)</p>
      <div class="quick-login-pills">
        <button type="button" class="quick-pill" onclick="setCredentials('admin', 'admin123')">Admin</button>
        <button type="button" class="quick-pill" onclick="setCredentials('receptionist', 'rec123')">Receptionist</button>
        <button type="button" class="quick-pill" onclick="setCredentials('dr.roshan', 'doc123')">Dentist</button>
      </div>
    </div>

    <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 14px;">
      <p style="font-size: 11.5px; color: var(--text-muted);">
        <i class="fa-solid fa-shield-halved" style="color: var(--secondary);"></i> Authorized Staff Access Only • Cardiff Met / ICBT
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function setCredentials(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      const alertMsg = document.getElementById('loginAlertMsg');
      const btn = document.getElementById('btnLogin');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.Auth.login({ username, password });
        if (res.success) {
          Toast.show('Welcome, ' + (res.data.fullName || res.data.username), 'success');
          sessionStorage.setItem('user', JSON.stringify(res.data));
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 400);
        }
      } catch (err) {
        alertMsg.textContent = err.message || 'Login failed. Please verify credentials.';
        alertBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to System';
      }
    });

    // Auto-redirect if already logged in
    (async () => {
      try {
        const res = await API.Auth.getSession();
        if (res.success && res.data) {
          window.location.href = 'index.html';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
